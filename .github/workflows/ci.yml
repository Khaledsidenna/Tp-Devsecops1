name: CI/CD - democyber

# Déclenchement sur push ou pull request sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber1:latest
    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Scan de sécurité Gitleaks (détection des secrets)
      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        continue-on-error: true

      # 3. Sauvegarde du rapport Gitleaks (Artifact)
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      # 4. Configuration de Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 5. Compilation du projet Java
      - name: Compile Java
        run: mvn compile

      # 6. Build Maven (Génération du fichier .jar)
      - name: Build Java project with Maven
        run: mvn clean package

      # 7. Connexion à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Construction de l'image Docker
      - name: Build Docker image
        run: docker build -t democyber:latest -t $DOCKER_IMAGE_NAME .

      # 9. Test local du conteneur Docker
      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      # 10. Scan de vulnérabilités Trivy (Génération du rapport SARIF)
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: democyber:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 11. Sauvegarde du rapport Trivy (Artifact)
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif

      # 12. Envoi de l'image vers Docker Hub
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME